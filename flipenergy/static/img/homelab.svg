<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1034" width="900" height="1034" class="hl-diagram" role="img" aria-labelledby="hl-title hl-desc">
<title id="hl-title">Dennis Zhang's homelab, November 2026</title>
<desc id="hl-desc">Visitors reach the homelab through Cloudflare and a Cloudflare Tunnel, past an OPNsense firewall, into a three-node Kubernetes cluster on Talos Linux where Traefik routes requests to self-hosted apps, with a TrueNAS box for NFS storage and offsite backups to Backblaze B2. Changes ship from GitHub through Concourse CI, which runs Helmsman, image builds and OpenTofu.</desc>
