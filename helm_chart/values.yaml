controllers:
  main:
    containers:
      main:
        image:
          repository: flipenergy/flipenergy
          pullPolicy: Always
          tag: latest
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi

strategy:
  type: RollingUpdate

# The image runs nginx as its unprivileged nginx user on port 8080.
defaultPodOptions:
  securityContext:
    runAsUser: 101
    runAsGroup: 101
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

service:
  main:
    controller: main
    ports:
      http:
        port: 80
        targetPort: 8080

ingress:
  main:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-homelab"
    hosts:
      - host: www.pleasenoddos.com
        paths:
          - path: /
      - host: pleasenoddos.com
        paths:
          - path: /
    tls:
      - secretName: personal-website-tls
        hosts:
          - pleasenoddos.com
          - www.pleasenoddos.com
