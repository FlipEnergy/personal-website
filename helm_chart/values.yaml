controllers:
  main:
    containers:
      image:
        repository: flipenergy/flipenergy
        pullPolicy: Always
        tag: latest

strategy:
  type: RollingUpdate

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-homelab"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hosts:
      - host: www.pleasenoddos.com
        paths:
          - path: /
      - host: pleasenoddos.com
        paths:
          - path: /
    tls:
      - secretName: personal-website-tls
        hosts:
          - pleasenoddos.com
          - www.pleasenoddos.com

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
